name: KodexIOS

options:
  bundleIdPrefix: dev.kodex
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en

settings:
  base:
    CURRENT_PROJECT_VERSION: 1
    GENERATE_INFOPLIST_FILE: YES
    MARKETING_VERSION: 0.1.0
    SWIFT_VERSION: 6.0
    TARGETED_DEVICE_FAMILY: 1,2

packages:
  OpenAPIGenerator:
    url: https://github.com/apple/swift-openapi-generator.git
    from: 1.10.0
  OpenAPIRuntime:
    url: https://github.com/apple/swift-openapi-runtime.git
    from: 1.8.0
  OpenAPIURLSession:
    url: https://github.com/apple/swift-openapi-urlsession.git
    from: 1.0.0

targets:
  KodexCore:
    type: framework
    platform: iOS
    sources:
      - Sources/KodexCore

  KodexAPI:
    type: framework
    platform: iOS
    sources:
      - Sources/KodexAPI
    dependencies:
      - target: KodexCore
      - package: OpenAPIRuntime
      - package: OpenAPIURLSession

  KodexIOS:
    type: application
    platform: iOS
    sources:
      - Sources/KodexIOS
    dependencies:
      - target: KodexCore
      - target: KodexAPI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.kodex.KodexIOS
        INFOPLIST_KEY_CFBundleDisplayName: Kodex
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES

  KodexIOSTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests/KodexCoreTests
    dependencies:
      - target: KodexCore
      - target: KodexAPI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.kodex.KodexIOSTests

  KodexIOSUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - Tests/KodexIOSUITests
    dependencies:
      - target: KodexIOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.kodex.KodexIOSUITests

schemes:
  KodexIOS:
    build:
      targets:
        KodexIOS: all
    test:
      targets:
        - KodexIOSTests
        - KodexIOSUITests
      gatherCoverageData: true
  KodexIOSLiveE2E:
    build:
      targets:
        KodexIOS: all
    test:
      targets:
        - KodexIOSUITests
      environmentVariables:
        KODEX_IOS_LIVE_E2E: "1"
        KODEX_GATEWAY_URL: "http://127.0.0.1:8787"
